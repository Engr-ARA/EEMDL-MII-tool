<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Measurement-Integrated Inventory Tool</title>
    <!-- stlite: Streamlit compiled to WebAssembly. Pinned version for reproducibility. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css"
    />
    <style>
      html, body { margin: 0; background: #ffffff; }
      #boot {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 12vh auto 0;
        padding: 28px 32px;
        text-align: center;
        color: #2d2d2d;
      }
      #boot h2 { color: #BF5700; margin-bottom: 10px; }
      #boot p { line-height: 1.5; color: #555; }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 22px auto;
        border: 4px solid #eee;
        border-top-color: #BF5700;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <h2>Loading the EEMDL MII Tool</h2>
      <div class="spinner"></div>
      <p>
        Initializing the in-browser Python environment. The first visit may take a few seconds
        while the scientific Python runtime is downloaded; repeat visits can use the browser cache.
      </p>
    </div>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js";

      const root = document.getElementById("root");
      const boot = document.getElementById("boot");

      // Hide the startup message as soon as the Streamlit frontend is mounted.
      const observer = new MutationObserver(() => {
        if (root.childElementCount > 0) {
          boot.style.display = "none";
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true });

      mount(
        {
          requirements: ["numpy", "pandas", "scipy", "openpyxl", "matplotlib"],
          entrypoint: "app.py",
          files: {
            // Only files Python needs at runtime are copied into stlite's virtual FS.
            // Templates and the logo stay as normal static GitHub Pages assets and
            // are downloaded only when the browser actually needs them.
            "app.py": { url: "./app.py" },
            "mii_model.py": { url: "./mii_model.py" },
            "figures.py": { url: "./figures.py" },
            ".streamlit/config.toml": { url: "./.streamlit/config.toml" },
          },
        },
        root
      );

      // Cache versioned CDN resources after the first visit. This cannot remove
      // the first-load download, but it can make repeat visits noticeably faster.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
